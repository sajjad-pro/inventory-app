name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Create clean Flutter project
        run: |
          flutter create --project-name inventory_app --org com.inventory scaffold_tmp

      - name: Fix Kotlin version bug
        run: |
          sed -i "s/ext.kotlin_version = '<latest-version>'/ext.kotlin_version = '1.9.10'/" scaffold_tmp/android/build.gradle || true

      - name: Copy your code
        run: |
          cp -r lib/. scaffold_tmp/lib/
          cp pubspec.yaml scaffold_tmp/pubspec.yaml
          mkdir -p scaffold_tmp/assets/fonts
          if [ -d "assets" ]; then cp -r assets/. scaffold_tmp/assets/; fi

      - name: Get dependencies
        working-directory: scaffold_tmp
        run: flutter pub get

      - name: Build APK
        working-directory: scaffold_tmp
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: inventory-app-apk
          path: scaffold_tmp/build/app/outputs/flutter-apk/app-release.apk
